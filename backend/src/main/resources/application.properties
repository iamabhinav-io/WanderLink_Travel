# WanderLink Backend Configuration
server.port=${PORT:8080}

# Database Configuration (supports MySQL / Postgres via env vars, defaults to H2 for local zero-config runs)
spring.datasource.url=${DB_URL:jdbc:h2:mem:wanderlink;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate & JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.H2Dialect}

# H2 Console (available when running in H2 mode)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Open-in-view setting
spring.jpa.open-in-view=false

# Demo Data Seeder Configuration (true = load sample demo users, trips, accommodations, food, groups)
wanderlink.data.seed=${SEED_DATA:true}

# CORS Configuration (comma-separated origins)
wanderlink.cors.allowed-origins=${WANDERLINK_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:80,http://localhost}
