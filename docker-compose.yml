services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: wanderlink-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wanderlink
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: wanderlink
      MYSQL_PASSWORD: wanderlinkpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Spring Boot Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wanderlink-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:mysql://mysql:3306/wanderlink?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_DRIVER: com.mysql.cj.jdbc.Driver
      DB_USERNAME: wanderlink
      DB_PASSWORD: wanderlinkpassword
      DB_DIALECT: org.hibernate.dialect.MySQLDialect
      WANDERLINK_CORS_ALLOWED_ORIGINS: http://localhost,http://localhost:80,http://localhost:3000,http://localhost:5173
      SEED_DATA: "true"

  # React Frontend (Nginx)
  frontend:
    build:
      context: ./WanderLink-community-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080/api
    container_name: wanderlink-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql_data:
